    <script>


    var name ;
function saveUser() {
    name = document.getElementById("fullName").value;
    sessionStorage.setItem("userName", name);
}
let captcha = "";

function generateCaptcha() {
    const char = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    captcha = "";

    for (let i = 0; i < 5; i++) {
        captcha += char.charAt(Math.floor(Math.random() * char.length));
    }

    document.getElementById("captchaText").innerText = captcha;
}

window.onload = function() {
    generateCaptcha();
    let today = new Date().toISOString().split('T')[0];
    document.getElementById("DoB").max = today;
}

function checkForm() {

    let password = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;
    let captchaInput = document.getElementById("captchaInput").value;
    let msg = document.getElementById("msg");

    let hasNumber = false;
    for (let i = 0; i < password.length; i++) {
        if (!isNaN(password[i])) {
            hasNumber = true;
            break;
        }
    }

    if (!hasNumber) {
        msg.innerHTML = "Password must contain a number";
        return false;
    }

    let hasUpper = false;
    for (let i = 0; i < password.length; i++) {
        if (password[i] >= 'A' && password[i] <= 'Z') {
            hasUpper = true;
            break;
        }
    }

    if (!hasUpper) {
        msg.innerHTML = "Password must contain a capital letter";
        return false;
    }

    if (password !== confirm) {
        msg.innerHTML = "Passwords do not match";
        return false;
    }

    if (captchaInput !== captcha) {
        document.getElementById("Cmsg").innerHTML = "Wrong captcha";
        return false;
    }

    return true;
}
window.onload = generateCaptcha;
</script>
